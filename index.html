<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Vote: ชาย VS หญิง</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .title {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .game-container {
            display: flex;
            width: 80%;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }

        .team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: flex 0.5s ease-in-out; /* ทำให้หลอดขยับนุ่มนวล */
            position: relative;
        }

        .team-boy {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .team-girl {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
        }

        .team-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score {
            font-size: 4rem;
            font-weight: bold;
        }

        .gift-info {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="title">💖 ใครจะชนะ? ส่งของขวัญเพื่อโหวต! 💖</div>

    <div class="game-container">
        <!-- ฝั่งชาย -->
        <div class="team team-boy" id="boy-team">
            <div class="team-title">ผู้ชาย 🧑🏻‍🦱</div>
            <div class="score" id="boy-score">0</div>
            <div class="gift-info">🌹 ส่ง "ดอกไม้" (+10)</div>
        </div>

        <!-- ฝั่งหญิง -->
        <div class="team team-girl" id="girl-team">
            <div class="team-title">ผู้หญิง 👩🏻‍🦰</div>
            <div class="score" id="girl-score">0</div>
            <div class="gift-info">🍩 ส่ง "ขนม" (+10)</div>
        </div>
    </div>

    <script>
        // ตัวแปรเก็บคะแนนเริ่มต้น
        let boyScore = 50; // เริ่มต้นที่ 50 เพื่อให้หลอดแบ่งครึ่งพอดี (50:50)
        let girlScore = 50;

        const boyTeamEl = document.getElementById('boy-team');
        const girlTeamEl = document.getElementById('girl-team');
        const boyScoreEl = document.getElementById('boy-score');
        const girlScoreEl = document.getElementById('girl-score');

        // ฟังก์ชันอัปเดตหน้าจอและการขยับของหลอดพลัง
        function updateDisplay() {
            boyScoreEl.innerText = boyScore;
            girlScoreEl.innerText = girlScore;

            // คำนวณสัดส่วนเป็นเปอร์เซ็นต์
            let total = boyScore + girlScore;
            let boyPercent = (boyScore / total) * 100;
            let girlPercent = (girlScore / total) * 100;

            // ปรับขนาดของสองฝั่งตามคะแนนจริง
            boyTeamEl.style.flex = boyPercent;
            girlTeamEl.style.flex = girlPercent;
        }

        // 🛑 ฟังก์ชันนี้คือจุดที่ฝั่งคุณจะใช้เรียกเมื่อมี Gift เข้ามา 🛑
        // ตัวอย่าง: ถ้า TikTok แจ้งว่าส่งดอกไม้ ให้สั่ง updateScore('boy', 10);
        function updateScore(team, points) {
            if (team === 'boy') {
                boyScore += points;
            } else if (team === 'girl') {
                girlScore += points;
            }
            updateDisplay();
        }

        // รันแสดงผลครั้งแรก
        updateDisplay();

        /* --- สำหรับทดสอบบนคอมของคุณ (กดปุ่มบนคีย์บอร์ดเพื่อลองเล่น) --- */
        window.addEventListener('keydown', (event) => {
            if (event.key === 'a' || event.key === 'A') {
                updateScore('boy', 10); // กด A เพิ่มคะแนนผู้ชาย
            }
            if (event.key === 'l' || event.key === 'L') {
                updateScore('girl', 10); // กด L เพิ่มคะแนนผู้หญิง
            }
        });
    </script>
</body>
</html>
