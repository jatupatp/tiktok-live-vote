<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Stream Vote: BOYS vs GIRLS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Montserrat', 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Background grid effect for streaming look */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .header-zone {
            text-align: center;
            margin-bottom: 30px;
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #ff0844, #ffb199);
            background-size: 300% 300%;
            animation: gradientMove 6s infinite alternate;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(79, 172, 254, 0.3);
        }

        .subtitle {
            font-size: 1.4rem;
            color: #85929E;
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Game Arena Layout */
        .battle-arena {
            display: flex;
            width: 90%;
            max-width: 1200px;
            height: 500px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 
                        0 0 40px rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .team-side {
            flex: 1; /* Dominated by JavaScript flex value dynamically */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: flex 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            padding: 40px;
            overflow: hidden;
        }

        /* Boys Side Styling */
        .side-boys {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            background-size: 200% 200%;
            box-shadow: inset -20px 0 30px rgba(0,0,0,0.2);
        }

        /* Girls Side Styling */
        .side-girls {
            background: linear-gradient(135deg, #ec008c, #fc6767);
            background-size: 200% 200%;
            box-shadow: inset 20px 0 30px rgba(0,0,0,0.2);
        }

        /* Team Content Animation and FX */
        .team-name {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .score-counter {
            font-size: 6rem;
            font-weight: 900;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            font-variant-numeric: tabular-nums;
            transition: transform 0.1s ease-out;
        }

        /* Triggered on score increment */
        .score-bounce {
            transform: scale(1.25);
            text-shadow: 0 0 40px rgba(255,255,255,0.9);
        }

        .action-hint {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .side-boys .action-hint {
            color: #00f2fe;
            border-color: rgba(0, 242, 254, 0.4);
        }

        .side-girls .action-hint {
            color: #ff9a9e;
            border-color: rgba(255, 154, 158, 0.4);
        }

        /* Floating Score Text Effect */
        .floating-effect {
            position: absolute;
            font-size: 2.5rem;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 0 15px rgba(255,255,255,0.8), 0 5px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Particles / Hearts Element */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: particleFade 1s ease-out forwards;
            z-index: 9;
        }

        /* VS Middle Badge */
        .vs-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            color: #0b0c10;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            box-shadow: 0 0 30px rgba(255,255,255,0.4), inset 0 0 10px rgba(0,0,0,0.2);
            z-index: 5;
            border: 4px solid #0b0c10;
        }

        /* Keyboard Controls Guide at bottom */
        .controls-guide {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #566573;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .key-cap {
            background: #2c3e50;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            border-bottom: 2px solid #1a252f;
            display: inline-block;
            margin: 0 3px;
        }

        /* Animations */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.5);
            }
            20% {
                opacity: 1;
                transform: translateY(0) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(0.8);
            }
        }

        @keyframes particleFade {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--x), var(--y)) scale(0.3) rotate(var(--r));
            }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="main-container">
        
        <!-- Header Title section -->
        <div class="header-zone">
            <h1 class="main-title">LIVE GIFT BATTLE</h1>
            <p class="subtitle">SEND GIFTS TO VOTE AND DONATE ON STREAM!</p>
        </div>

        <!-- Battle Screen Arena -->
        <div class="battle-arena">
            
            <div class="vs-badge">VS</div>

            <!-- Boys Team Side -->
            <div class="team-side side-boys" id="side-boys">
                <div class="team-name">BOYS <span>♂</span></div>
                <div class="score-counter" id="score-boys">100</div>
                <div class="action-hint">🌹 Send "Rose" (+10)</div>
            </div>

            <!-- Girls Team Side -->
            <div class="team-side side-girls" id="side-girls">
                <div class="team-name">GIRLS <span>♀</span></div>
                <div class="score-counter" id="score-girls">100</div>
                <div class="action-hint">🍩 Send "Donut" (+10)</div>
            </div>

        </div>

        <!-- Control Guideline for Host / Testing -->
        <div class="controls-guide">
            💡 <strong>Host Test Mode:</strong> Press <span class="key-cap">A</span> to simulate Boys vote | Press <span class="key-cap">L</span> to simulate Girls vote.
        </div>

    </div>

    <script>
        // Use standard Web Audio API to synthesize neon electronic sound effects completely without external files.
        // This ensures the audio functions perfectly inside GitHub Pages and OBS Studio instantly.
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSoundFX(type) {
            // Resume context if suspended (browser security policy)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'boy') {
                // Futuristic retro laser pop sound for Boys side
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'girl') {
                // High-pitched magical sparkle ding sound for Girls side
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 note
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.05); // A5 note
                
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        // Initialize score states
        let boysScore = 100;
        let girlsScore = 100;

        const sideBoys = document.getElementById('side-boys');
        const sideGirls = document.getElementById('side-girls');
        const scoreBoysEl = document.getElementById('score-boys');
        const scoreGirlsEl = document.getElementById('score-girls');
        const arena = document.querySelector('.battle-arena');

        // Main renderer mapping score dynamic percentages to CSS flexbox layouts
        function updateScreen() {
            scoreBoysEl.innerText = boysScore;
            scoreGirlsEl.innerText = girlsScore;

            let total = boysScore + girlsScore;
            let boysPercentage = (boysScore / total) * 100;
            let girlsPercentage = (girlsScore / total) * 100;

            // Update smooth layout ratios dynamically
            sideBoys.style.flex = boysPercentage;
            sideGirls.style.flex = girlsPercentage;
        }

        // Action mechanism triggerable by TikTok Connector backend or test hotkeys
        function addScore(team, amount) {
            playSoundFX(team);

            if (team === 'boy') {
                boysScore += amount;
                triggerVisualFX(sideBoys, `+${amount}`, '#00f2fe');
                animateTextBounce(scoreBoysEl);
            } else if (team === 'girl') {
                girlsScore += amount;
                triggerVisualFX(sideGirls, `+${amount}`, '#ff9a9e');
                animateTextBounce(scoreGirlsEl);
            }

            updateScreen();
        }

        // Animated text bounce scaling handler
        function animateTextBounce(element) {
            element.classList.add('score-bounce');
            setTimeout(() => {
                element.classList.remove('score-bounce');
            }, 100);
        }

        // Complex Graphic Visual FX Generator: Floating Numbers and Floating Particles
        function triggerVisualFX(sideElement, text, color) {
            // 1. Create Floating Vote Number
            const floatingText = document.createElement('div');
            floatingText.className = 'floating-effect';
            floatingText.innerText = text;
            floatingText.style.color = '#ffffff';
            
            // Random positioning inside the side container bounds
            const randomX = 30 + Math.random() * 40; // percentage range 30% - 70%
            const randomY = 40 + Math.random() * 20; // percentage range 40% - 60%
            floatingText.style.left = `${randomX}%`;
            floatingText.style.top = `${randomY}%`;

            sideElement.appendChild(floatingText);
            setTimeout(() => floatingText.remove(), 800);

            // 2. Spawn Burst Particles
            const burstCount = 10;
            for (let i = 0; i < burstCount; i++) {
                const particle = document.createElement('svg');
                particle.className = 'particle';
                particle.setAttribute('width', '20');
                particle.setAttribute('height', '20');
                particle.setAttribute('viewBox', '0 0 24 24');
                
                // Draw a simple heart shape or star element
                particle.innerHTML = `<path fill="${color}" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>`;
                
                // Track randomized trajectory offsets for dynamic CSS animation variables
                const moveX = (Math.random() - 0.5) * 250;
                const moveY = -(Math.random() * 150 + 50);
                const rotateDeg = (Math.random() - 0.5) * 360;
                
                particle.style.setProperty('--x', `${moveX}px`);
                particle.style.setProperty('--y', `${moveY}px`);
                particle.style.setProperty('--r', `${rotateDeg}deg`);
                
                // Placement centered relative to text pop position
                particle.style.left = `${randomX}%`;
                particle.style.top = `${randomY}%`;

                sideElement.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }

        // Keyboard Event Listeners for local testing
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A') {
                addScore('boy', 10);
            }
            if (e.key === 'l' || e.key === 'L') {
                addScore('girl', 10);
            }
        });

        // Initial launch screen render execution
        updateScreen();
    </script>
</body>
</html>
