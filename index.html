<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live: Cartoon Push Battle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Scoreboard for Wins Counter */
        .scoreboard {
            display: flex;
            gap: 40px;
            margin-bottom: 10px;
            z-index: 10;
        }

        .win-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 25px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px solid transparent;
        }

        .win-boys {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            color: #00f2fe;
        }

        .win-girls {
            border-color: #ff758c;
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.2);
            color: #ff758c;
        }

        .win-counter {
            font-size: 2rem;
            font-weight: 900;
            margin-top: 5px;
            color: white;
        }

        /* Main Battle Arena */
        .battle-arena {
            display: flex;
            width: 90%;
            max-width: 1100px;
            height: 480px;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 4px solid #1a1c29;
        }

        .team-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px;
            transition: flex 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .side-boys {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            align-items: flex-start;
        }

        .side-girls {
            background: linear-gradient(135deg, #3a1c1c, #6b2d5c, #89216b);
            align-items: flex-end;
        }

        .team-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .side-boys .team-title { color: #00f2fe; }
        .side-girls .team-title { color: #ff758c; }

        .score-display {
            font-size: 4.5rem;
            font-weight: 900;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        /* Push Center Interface with Characters */
        .push-center-axis {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 8px;
            background: #ffffff;
            box-shadow: 0 0 20px #ffffff, 0 0 40px #ffffff;
            z-index: 5;
            transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .character-container {
            position: absolute;
            display: flex;
            align-items: center;
            width: 300px; /* ยึดพื้นที่ไว้ครอบคลุมสองตัวละคร */
            justify-content: space-between;
            pointer-events: none;
        }

        .cartoon-char {
            width: 130px;
            height: 130px;
            transition: transform 0.1s;
        }

        /* ท่าทางและอนิเมชันเวลากดดัน */
        .char-boy {
            transform: scaleX(1);
            filter: drop-shadow(0 0 10px #00f2fe);
        }
        .char-girl {
            transform: scaleX(-1); /* กลับด้านให้หันหน้าเข้าหากัน */
            filter: drop-shadow(0 0 10px #ff758c);
        }

        /* แอนิเมชันสั่นเมื่อใกล้แพ้ (เหงื่อตก) */
        @keyframes panicShake {
            0%, 100% { transform: translate(0, 0) scaleX(1); }
            25% { transform: translate(-2px, 2px) scaleX(1.02); }
            75% { transform: translate(2px, -2px) scaleX(0.98); }
        }
        @keyframes panicShakeGirl {
            0%, 100% { transform: translate(0, 0) scaleX(-1); }
            25% { transform: translate(-2px, 2px) scaleX(-1.02); }
            75% { transform: translate(2px, -2px) scaleX(-0.98); }
        }
        .panic-boy { animation: panicShake 0.15s infinite; }
        .panic-girl { animation: panicShakeGirl 0.15s infinite; }

        /* Pop-up FX */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            font-size: 2rem;
            animation: heartFloat 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 6;
        }

        @keyframes heartFloat {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -30px) scale(1.3); }
            100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0.7); }
        }

        /* Banner ผู้ชนะตอนจบยก */
        .victory-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(13, 14, 21, 0.95);
            border: 4px solid #fff;
            padding: 30px 60px;
            border-radius: 20px;
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            z-index: 20;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(255,255,255,0.4);
            white-space: nowrap;
        }
        .victory-banner.show { transform: translate(-50%, -50%) scale(1); }

        /* Control Box ด้านล่าง (3 ขั้นรางวัล) */
        .control-panel {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .gift-btn {
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .gift-btn:active { transform: scale(0.92); }

        .btn-b1 { background: #0052d4; box-shadow: 0 0 10px rgba(0,82,212,0.4); }
        .btn-b2 { background: #4364f7; box-shadow: 0 0 15px rgba(67,100,247,0.5); }
        .btn-b3 { background: #00f2fe; color: #000; font-weight: 900; box-shadow: 0 0 20px #00f2fe; }

        .btn-g1 { background: #962666; box-shadow: 0 0 10px rgba(150,38,102,0.4); }
        .btn-g2 { background: #ec008c; box-shadow: 0 0 15px rgba(236,0,140,0.5); }
        .btn-g3 { background: #ff758c; color: #000; font-weight: 900; box-shadow: 0 0 20px #ff758c; }
    </style>
</head>
<body>

    <!-- สกอร์บอร์ดนับจำนวนรอบที่ชนะด้านบน -->
    <div class="scoreboard">
        <div class="win-box win-boys">
            BOYS WINS
            <div class="win-counter" id="wins-boys">0</div>
        </div>
        <div class="win-box win-girls">
            GIRLS WINS
            <div class="win-counter" id="wins-girls">0</div>
        </div>
    </div>

    <!-- สนามรบและเส้นแบ่งตรงกลาง -->
    <div class="battle-arena">
        
        <!-- ป้ายประกาศชัยชนะรอบ -->
        <div class="victory-banner" id="victory-banner">BOYS WIN!</div>

        <!-- ฝั่งชาย -->
        <div class="team-side side-boys" id="side-boys">
            <div class="team-title">BOYS 🧑</div>
            <div class="score-display" id="score-boys">500</div>
            <div style="font-size:0.9rem; color:#00f2fe; opacity:0.7">Target: 1000</div>
        </div>

        <!-- เส้นแบ่งกลางและตัวการ์ตูนดันกัน -->
        <div class="push-center-axis" id="center-axis">
            <div class="character-container">
                <!-- การ์ตูนชาย SVG -->
                <svg class="cartoon-char char-boy" id="avatar-boy" viewBox="0 0 100 100">
                    <circle cx="50" cy="40" r="25" fill="#4facfe"/>
                    <path d="M50 15 C35 15 30 25 30 30 C35 30 40 25 50 25 C60 25 65 30 70 30 C70 25 65 15 50 15 Z" fill="#1e3c72"/>
                    <circle cx="42" cy="38" r="3" fill="#fff"/><circle cx="42" cy="38" r="1.5" fill="#000"/>
                    <circle cx="58" cy="38" r="3" fill="#fff"/><circle cx="58" cy="38" r="1.5" fill="#000"/>
                    <path d="M40 52 Q50 60 60 52" stroke="#fff" stroke-width="3" fill="none"/>
                    <!-- แขนดัน -->
                    <path d="M65 55 Q85 45 95 50" stroke="#4facfe" stroke-width="8" stroke-linecap="round" fill="none"/>
                </svg>
                <!-- การ์ตูนหญิง SVG -->
                <svg class="cartoon-char char-girl" id="avatar-girl" viewBox="0 0 100 100">
                    <circle cx="50" cy="40" r="25" fill="#ff7eb3"/>
                    <path d="M22 35 C20 15 50 5 80 15 C75 35 75 40 75 45 C50 45 25 45 22 35 Z" fill="#ff416c"/>
                    <circle cx="42" cy="38" r="3" fill="#fff"/><circle cx="42" cy="38" r="1.5" fill="#000"/>
                    <circle cx="58" cy="38" r="3" fill="#fff"/><circle cx="58" cy="38" r="1.5" fill="#000"/>
                    <path d="M42 54 Q50 48 58 54" stroke="#fff" stroke-width="3" fill="none"/>
                    <!-- แขนดัน -->
                    <path d="M65 55 Q85 45 95 50" stroke="#ff7eb3" stroke-width="8" stroke-linecap="round" fill="none"/>
                </svg>
            </div>
        </div>

        <!-- ฝั่งหญิง -->
        <div class="team-side side-girls" id="side-girls">
            <div class="team-title">GIRLS 👩</div>
            <div class="score-display" id="score-girls">500</div>
            <div style="font-size:0.9rem; color:#ff758c; opacity:0.7">Target: 1000</div>
        </div>

    </div>

    <!-- แผงควบคุมจำลอง 3 ระดับของขวัญ (Host Test Panel) -->
    <div class="control-panel">
        <div class="btn-group">
            <button class="gift-btn btn-b1" onclick="addScore('boy', 10)">🌹 Rose (+10)</button>
            <button class="gift-btn btn-b2" onclick="addScore('boy', 100)">🎮 Game (+100)</button>
            <button class="gift-btn btn-b3" onclick="addScore('boy', 1000)">🚀 Rocket (+1000)</button>
        </div>
        <div style="align-self: center; color: #566573; font-size: 0.85rem; text-align:center;">
            <strong>TEST MODE KEYS:</strong><br>Boys: 1, 2, 3 | Girls: 8, 9, 0
        </div>
        <div class="btn-group">
            <button class="gift-btn btn-g1" onclick="addScore('girl', 10)">🍩 Donut (+10)</button>
            <button class="gift-btn btn-g2" onclick="addScore('girl', 100)">👑 Crown (+100)</button>
            <button class="gift-btn btn-g3" onclick="addScore('girl', 1000)">🏰 Castle (+1000)</button>
        </div>
    </div>

    <script>
        // สร้างระบบเสียงสังเคราะห์อัจฉริยะ (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(tier) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (tier === 10) { // เสียงป๊อปปกติ
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (tier === 100) { // เสียงเด้งคอมโบสองจังหวะ
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (tier === 1000) { // เสียงไซเรนอลังการของขวัญใหญ่
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (tier === 'victory') { // เสียงฉลองชัยชนะเมื่อจบรอบ
                osc.type = 'square';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                osc.frequency.setValueAtTime(1046.5, audioCtx.currentTime + 0.3); // C6
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        // ตัวแปรและสถานะเริ่มต้นของเกม
        let boyScore = 500;
        let girlScore = 500;
        let boyWins = 0;
        let girlWins = 0;
        let isRoundActive = true;

        const sideBoys = document.getElementById('side-boys');
        const sideGirls = document.getElementById('side-girls');
        const scoreBoysEl = document.getElementById('score-boys');
        const scoreGirlsEl = document.getElementById('score-girls');
        const centerAxis = document.getElementById('center-axis');
        const avatarBoy = document.getElementById('avatar-boy');
        const avatarGirl = document.getElementById('avatar-girl');
        const victoryBanner = document.getElementById('victory-banner');

        function updateGameLayout() {
            scoreBoysEl.innerText = boyScore;
            scoreGirlsEl.innerText = girlScore;

            // คำนวณอัตราส่วนเปอร์เซ็นต์
            let total = boyScore + girlScore;
            let boyPercent = (boyScore / total) * 100;
            let girlPercent = (girlScore / total) * 100;

            // ปรับขนาดหน้าจอฝั่งซ้ายและขวาตามแรงดันคะแนน
            sideBoys.style.flex = boyPercent;
            sideGirls.style.flex = girlPercent;
            centerAxis.style.left = `${boyPercent}%`;

            // ตรวจสอบความตื่นเต้น (สั่นเครียดและเหงื่อตกถ้าคะแนนต่ำกว่า 200)
            if (boyScore < 200) avatarBoy.classList.add('panic-boy');
            else avatarBoy.classList.remove('panic-boy');

            if (girlScore < 200) avatarGirl.classList.add('panic-girl');
            else avatarGirl.classList.remove('panic-girl');

            // ตรวจสอบเงื่อนไขผู้ชนะรอบ (แตะ 1000 คะแนนก่อน)
            if (isRoundActive) {
                if (boyScore >= 1000) {
                    endRound('boy');
                } else if (girlScore >= 1000) {
                    endRound('girl');
                }
            }
        }

        function addScore(team, amount) {
            if (!isRoundActive) return;

            playSound(amount);

            if (team === 'boy') {
                boyScore += amount;
                girlScore = Math.max(0, girlScore - amount); // ดันคะแนนอีกฝั่งให้ลดลง
                popHeart('#00f2fe');
            } else {
                girlScore += amount;
                boyScore = Math.max(0, boyScore - amount); // ดันคะแนนอีกฝั่งให้ลดลง
                popHeart('#ff758c');
            }
            updateGameLayout();
        }

        // เอฟเฟกต์หัวใจระเบิดพุ่งขึ้นด้านบน
        function popHeart(color) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '❤️';
            heart.style.color = color;
            
            // สุ่มทิศทางกระจายตัว
            const moveX = `${(Math.random() - 0.5) * 160}px`;
            const moveY = `-${Math.random() * 150 + 80}px`;
            heart.style.setProperty('--x', moveX);
            heart.style.setProperty('--y', moveY);
            
            centerAxis.appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        }

        // ฟังก์ชันประกาศผลผู้ชนะและเริ่มยกถัดไป
        function endRound(winner) {
            isRoundActive = false;
            playSound('victory');

            if (winner === 'boy') {
                boyWins++;
                document.getElementById('wins-boys').innerText = boyWins;
                victoryBanner.innerText = "BOYS WIN THE ROUND! 🏆";
                victoryBanner.style.color = "#00f2fe";
                victoryBanner.style.borderColor = "#00f2fe";
            } else {
                girlWins++;
                document.getElementById('wins-girls').innerText = girlWins;
                victoryBanner.innerText = "GIRLS WIN THE ROUND! 🏆";
                victoryBanner.style.color = "#ff758c";
                victoryBanner.style.borderColor = "#ff758c";
            }

            victoryBanner.classList.add('show');

            // หน่วงเวลา 3 วินาทีเพื่อเคลียร์กระดานเริ่มรอบถัดไป
            setTimeout(() => {
                boyScore = 500;
                girlScore = 500;
                victoryBanner.classList.remove('show');
                avatarBoy.classList.remove('panic-boy');
                avatarGirl.classList.remove('panic-girl');
                isRoundActive = true;
                updateGameLayout();
            }, 3000);
        }

        // ผูกปุ่มลัดคีย์บอร์ดสำหรับทดสอบบนเครื่อง Mac M1
        window.addEventListener('keydown', (e) => {
            if (e.key === '1') addScore('boy', 10);
            if (e.key === '2') addScore('boy', 100);
            if (e.key === '3') addScore('boy', 1000);
            
            if (e.key === '8') addScore('girl', 10);
            if (e.key === '9') addScore('girl', 100);
            if (e.key === '0') addScore('girl', 1000);
        });

        // เปิดหน้าจอครั้งแรก
        updateGameLayout();
    </script>
</body>
</html>
